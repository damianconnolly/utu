<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upminster Town United FC - Fixtures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8" x-data="fixturesApp()" x-init="loadFixtures()">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between border-b pb-6 mb-6">
      <div>
        <h1 class="text-3xl font-extrabold text-blue-900">Upminster Town United FC</h1>
        <p class="text-gray-600 mt-1">Central Fixture Hub (BCFA & Echo Youth Leagues)</p>
      </div>
      <div class="mt-4 md:mt-0 text-right">
        <button @click="loadFixtures()" class="text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded font-medium border border-blue-200">
          🔄 Refresh Fixtures
        </button>
      </div>
    </div>

    <!-- Error Banner -->
    <div x-show="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm" x-text="errorMessage"></div>

    <!-- Filters Section -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Filter: Team / Age Group -->
      <div>
        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Team / Age Group</label>
        <select x-model="selectedTeam" class="w-full border-gray-300 rounded-lg p-2.5 bg-gray-50 border text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">All Teams / Age Groups</option>
          <template x-for="team in uniqueTeams" :key="team">
            <option :value="team" x-text="team"></option>
          </template>
        </select>
      </div>

      <!-- Filter: League -->
      <div>
        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">League</label>
        <select x-model="selectedLeague" class="w-full border-gray-300 rounded-lg p-2.5 bg-gray-50 border text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">All Leagues</option>
          <option value="BCFA Youth League">BCFA Youth League</option>
          <option value="Echo Youth League">Echo Youth League</option>
        </select>
      </div>

      <!-- Filter: Venue -->
      <div>
        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Venue / Ground</label>
        <select x-model="selectedVenue" class="w-full border-gray-300 rounded-lg p-2.5 bg-gray-50 border text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">All Venues</option>
          <template x-for="venue in uniqueVenues" :key="venue">
            <option :value="venue" x-text="venue"></option>
          </template>
        </select>
      </div>

    </div>

    <!-- Fixtures List -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      
      <div x-show="loading" class="p-8 text-center text-gray-500 animate-pulse">
        Fetching live fixtures directly from FA Full-Time...
      </div>

      <div x-show="!loading && filteredFixtures.length === 0" class="p-8 text-center text-gray-500">
        No matching fixtures found for the selected filters.
      </div>

      <div class="divide-y divide-gray-100" x-show="!loading && filteredFixtures.length > 0">
        <template x-for="fixture in filteredFixtures" :key="fixture.id">
          <div class="p-4 hover:bg-gray-50 flex flex-col md:flex-row md:items-center justify-between gap-4">
            
            <!-- Date & League Info -->
            <div class="md:w-1/4">
              <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded bg-blue-100 text-blue-800 mb-1" x-text="fixture.league"></span>
              <div class="font-bold text-gray-800" x-text="fixture.date"></div>
            </div>

            <!-- Teams -->
            <div class="md:w-2/4 flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-100">
              <span class="font-semibold text-sm" :class="fixture.isHome ? 'text-blue-900 font-bold' : 'text-gray-700'" x-text="fixture.homeTeam"></span>
              <span class="px-2.5 py-1 text-xs font-bold bg-white rounded border text-gray-600 mx-2" x-text="fixture.timeOrScore || 'VS'"></span>
              <span class="font-semibold text-sm text-right" :class="!fixture.isHome ? 'text-blue-900 font-bold' : 'text-gray-700'" x-text="fixture.awayTeam"></span>
            </div>

            <!-- Venue -->
            <div class="md:w-1/4 md:text-right text-xs text-gray-600">
              <div class="font-semibold text-gray-800">📍 Venue</div>
              <div x-text="fixture.venue"></div>
            </div>

          </div>
        </template>
      </div>

    </div>
  </div>

  <script>
    function fixturesApp() {
      return {
        loading: true,
        errorMessage: '',
        fixtures: [],
        selectedTeam: '',
        selectedLeague: '',
        selectedVenue: '',

        workerApiUrl: 'https://utufixtures.damianconnolly.workers.dev',

        sources: [
          {
            league: 'BCFA Youth League',
            url: 'https://fulltime.thefa.com/fixtures.html?selectedSeason=486141579&selectedClub=533106051&itemsPerPage=100'
          },
          {
            league: 'Echo Youth League',
            url: 'https://fulltime.thefa.com/fixtures.html?selectedSeason=939968858&selectedClub=861410336&itemsPerPage=100'
          }
        ],

        cleanTeamName(name) {
          if (!name) return 'Unknown';
          return name.replace(/Upminster Town United/i, '').trim() || name;
        },

        async loadFixtures() {
          this.loading = true;
          this.errorMessage = '';
          this.fixtures = [];

          for (const src of this.sources) {
            try {
              const targetUrl = `${this.workerApiUrl}?url=${encodeURIComponent(src.url)}`;
              const res = await fetch(targetUrl);
              
              if (!res.ok) {
                throw new Error(`Worker returned status ${res.status}`);
              }

              const htmlText = await res.text();

              if (htmlText) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                // Target table rows or fixture list item elements
                const rows = doc.querySelectorAll('tr, .fixture-list-item, .fixture-row');

                rows.forEach((row, i) => {
                  const text = row.innerText || '';
                  
                  if (text.toLowerCase().includes('upminster')) {
                    // Extract links for specific team names or fallback to cell text
                    const teamLinks = Array.from(row.querySelectorAll('a')).map(a => a.innerText.trim()).filter(t => t.length > 2);
                    const cellTexts = Array.from(row.querySelectorAll('td, div, span')).map(c => c.innerText.trim()).filter(Boolean);

                    const homeTeam = teamLinks[0] || cellTexts[1] || 'Upminster Town United';
                    const awayTeam = teamLinks[1] || cellTexts[cellTexts.length - 1] || 'Opponent';
                    
                    const dateMatch = text.match(/\d{1,2}\/\d{1,2}\/\d{2,4}|\d{1,2}\s+[A-Za-z]{3}/);
                    const dateStr = dateMatch ? dateMatch[0] : (cellTexts[0] || 'TBC');
                    
                    const scoreMatch = text.match(/\d{1,2}:\d{2}|\d+\s*-\s*\d+/);
                    const timeOrScore = scoreMatch ? scoreMatch[0] : 'VS';
                    
                    const venue = cellTexts.find(c => c.toLowerCase().includes('park') || c.toLowerCase().includes('road') || c.toLowerCase().includes('ground') || c.toLowerCase().includes('playing')) || 'Ground TBC';

                    const isHome = homeTeam.toLowerCase().includes('upminster');

                    this.fixtures.push({
                      id: `${src.league}-${i}-${dateStr}`,
                      league: src.league,
                      date: dateStr,
                      homeTeam,
                      awayTeam,
                      timeOrScore,
                      venue,
                      upminsterTeam: isHome ? this.cleanTeamName(homeTeam) : this.cleanTeamName(awayTeam),
                      isHome
                    });
                  }
                });
              }
            } catch (err) {
              console.error(`Error loading ${src.league}:`, err);
              this.errorMessage = `Failed to parse fixtures: ${err.message}.`;
            }
          }

          this.loading = false;
        },

        get uniqueTeams() {
          const teams = this.fixtures.map(f => f.upminsterTeam).filter(Boolean);
          return [...new Set(teams)].sort();
        },

        get uniqueVenues() {
          const venues = this.fixtures.map(f => f.venue).filter(Boolean);
          return [...new Set(venues)].sort();
        },

        get filteredFixtures() {
          return this.fixtures.filter(f => {
            const matchTeam = !this.selectedTeam || f.upminsterTeam === this.selectedTeam;
            const matchLeague = !this.selectedLeague || f.league === this.selectedLeague;
            const matchVenue = !this.selectedVenue || f.venue === this.selectedVenue;
            return matchTeam && matchLeague && matchVenue;
          });
        }
      }
    }
  </script>
</body>
</html>
