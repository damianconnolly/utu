<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upminster Town United FC - Fixtures</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <div class="border-b pb-6 mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-blue-900">Upminster Town United FC</h1>
        <p class="text-gray-600 mt-1">Official Fixtures Hub (BCFA & Echo Youth Leagues)</p>
      </div>
    </div>

    <!-- League Sections -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- BCFA Youth League Widget -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="flex items-center justify-between mb-4 pb-2 border-b">
          <h2 class="text-xl font-bold text-blue-900">BCFA Youth League</h2>
          <a href="https://fulltime.thefa.com/fixtures.html?selectedClub=533106051" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline">Open on FA Site ↗</a>
        </div>
        <div class="w-full overflow-hidden rounded-lg border border-gray-100 bg-white">
          <iframe 
            src="https://fulltime.thefa.com/fixtures.html?selectedClub=533106051" 
            width="100%" 
            height="600" 
            frameborder="0" 
            scrolling="auto"
            loading="lazy"
            class="w-full border-0">
          </iframe>
        </div>
      </div>

      <!-- Echo Youth League Widget -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="flex items-center justify-between mb-4 pb-2 border-b">
          <h2 class="text-xl font-bold text-blue-900">Echo Youth League</h2>
          <a href="https://fulltime.thefa.com/fixtures.html?selectedClub=861410336" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline">Open on FA Site ↗</a>
        </div>
        <div class="w-full overflow-hidden rounded-lg border border-gray-100 bg-white">
          <iframe 
            src="https://fulltime.thefa.com/fixtures.html?selectedClub=861410336" 
            width="100%" 
            height="600" 
            frameborder="0" 
            scrolling="auto"
            loading="lazy"
            class="w-full border-0">
          </iframe>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
